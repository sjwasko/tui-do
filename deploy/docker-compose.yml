# tui-do development Vikunja instance.
#
# Pinned to the SAME image versions as production (sw-hp2) so behaviour differences
# between dev and prod are never a version artifact. Verified 2026-08-24:
#   vikunja/vikunja:2.5.0   postgres:18.4
#
# Runs on sw-surface. Binds loopback only; the tailnet gets it via `tailscale serve`.
# See deploy/README.md.

name: tui-do-dev

services:
  vikunja:
    image: vikunja/vikunja:2.5.0
    container_name: tui-do-vikunja
    restart: unless-stopped
    depends_on:
      vikunja-db:
        condition: service_healthy
    env_file: [./vikunja.env]
    volumes:
      # Attachments and uploaded files.
      - ${TUI_DO_DEV_ROOT:-/opt/appdata/tui-do-dev}/files:/db
    healthcheck:
      # The Vikunja image ships no shell and no curl/wget, so an exec-form probe
      # against its own binary is the only option. `vikunja healthcheck` opens a DB
      # connection and re-checks the migration table. Same probe production uses.
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:3456:3456"

  vikunja-db:
    image: postgres:18.4
    container_name: tui-do-vikunja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TUI_DO_DB_USER:-vikunja}
      POSTGRES_PASSWORD: ${TUI_DO_DB_PASSWORD:?set TUI_DO_DB_PASSWORD in deploy/.env}
      POSTGRES_DB: ${TUI_DO_DB_NAME:-vikunja}
    volumes:
      # Local disk only. Never an SMB mount -- Postgres on SMB corrupts.
      #
      # Mount at /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18+
      # stores data in a major-version subdirectory (.../18/docker) so that
      # `pg_upgrade --link` works without crossing a mount boundary; pointing the
      # mount at the old path makes the image refuse to start. Production uses the
      # same layout.
      - ${TUI_DO_DEV_ROOT:-/opt/appdata/tui-do-dev}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TUI_DO_DB_USER:-vikunja} -d ${TUI_DO_DB_NAME:-vikunja}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
