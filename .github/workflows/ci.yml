name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Gating job. Linux is the tier-1 platform through GA.
  check:
    name: fmt + clippy + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # Ubuntu LTS is the second tier-1 target. Arch and Ubuntu LTS diverge sharply on glibc,
  # so a green build on the dev workstation does not imply a green build here.
  ubuntu-lts:
    name: build + test (ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install toolchain deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test --workspace

  # Non-gating. macOS is a post-GA port; this exists only so the port is not an excavation.
  macos-drift:
    name: cargo check (macos, non-gating)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # about.toml's `accepted` list duplicates deny.toml's `allow` by hand, with nothing
  # enforcing agreement -- a new transitive licence used to fail `cargo about generate`
  # only at tag time, after the gate had already gone green. Running it here fails a PR
  # instead of a release.
  licenses:
    name: cargo-about (third-party licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-about
        # Pinned to the same version release.yml installs, so a break shows up in
        # exactly one place, not two disagreeing ones.
        run: cargo install cargo-about --version 0.9.2 --locked --features=cli
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
      - run: test -s THIRD-PARTY-LICENSES.md
