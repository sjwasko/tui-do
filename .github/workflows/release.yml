name: Release

on:
  push:
    tags: ['v*']

# The release job creates a Release, which needs more than the default read token.
permissions:
  contents: write

jobs:
  # A tag can be pushed from any commit, including one CI has never seen. Without this
  # a release is an untested binary wearing a version number.
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Generated once and shared by both matrix legs below: the two targets produce the
  # same file from the same lockfile, and building it twice bought nothing but a second
  # `cargo install cargo-about`.
  licenses:
    name: third-party licences
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-about
        # Pinned: an unpinned `cargo-about` takes whatever last published, and a new
        # major version with a changed template context breaks `about.hbs` at tag time
        # with no earlier warning. Bump deliberately, alongside the same pin in
        # ci.yml's `licenses` job, which exists so that break shows up on a PR instead.
        run: cargo install cargo-about --version 0.9.2 --locked --features=cli
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
      - run: test -s THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.md

  build:
    name: build ${{ matrix.target }}
    needs: [gate, licenses]
    # Per-target, because the darwin leg cannot be produced on Linux: cross-compiling to
    # Apple's platform needs its SDK, which is not redistributable. `macos-latest` is
    # Apple Silicon, so that leg is a plain native build -- simpler than the aarch64 musl
    # one, which needs `cross`. Runners are free here because the repository is public.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # Apple Silicon only, decided 2026-09-07. An Intel leg would need a second
          # `macos-13` job or a `lipo` universal binary; nobody who runs this has one.
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux-only: `!matrix.cross` is now true for darwin as well, and `apt-get` on a
      # macOS runner fails the job. macOS needs no equivalent -- the Xcode Command Line
      # Tools are preinstalled, which is the C toolchain bundled SQLite compiles with.
      - name: musl C toolchain, for the bundled SQLite
        if: ${{ runner.os == 'Linux' && !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --bin tui-do --target ${{ matrix.target }}

      - name: build (cross)
        if: ${{ matrix.cross }}
        run: |
          cargo install cross --version 0.2.5 --locked
          cross build --release --bin tui-do --target ${{ matrix.target }}

      # A build that silently went dynamic must fail the release rather than ship: the
      # failure it causes lands on the user's machine, at startup, as a linker error.
      - name: refuse to ship anything that is not static
        if: ${{ runner.os == 'Linux' }}
        run: |
          f=target/${{ matrix.target }}/release/tui-do
          file "$f"
          # The property that matters is "no dynamic interpreter", not which static
          # variant: a musl build may report `static-pie linked` or plain
          # `statically linked` depending on the target and the tool. Both pass;
          # anything dynamic fails, because that failure otherwise lands on the
          # user's machine at startup as a linker error.
          file "$f" | grep -q 'dynamically linked' \
            && { echo "DYNAMIC -- refusing to publish"; exit 1; }
          file "$f" | grep -Eq 'static-pie linked|statically linked' \
            || { echo "NOT STATIC -- refusing to publish"; exit 1; }

      # The same claim, in the only form macOS can make it.
      #
      # A Mach-O executable cannot be statically linked: Apple ships no static libSystem
      # and does not support one, so the Linux check above would fail a perfectly good
      # darwin build for lacking a property the platform does not have. What that check
      # is really asserting is "this depends on nothing the user's machine might not
      # have", and on macOS that is exactly `otool -L` naming only system libraries.
      #
      # It catches the failure the Linux gate exists for: a Homebrew libsqlite3 or
      # libssl linked in from the runner would ship a binary that dies on a Mac without
      # Homebrew, at startup, with a dyld error.
      - name: refuse to ship anything linked outside the system
        if: ${{ runner.os == 'macOS' }}
        run: |
          f=target/${{ matrix.target }}/release/tui-do
          file "$f"
          otool -L "$f"

          # `tail -n +2` drops otool's first line, which is the binary's own path.
          # `|| true` because grep exits 1 when it matches nothing, which is the pass.
          outside=$(otool -L "$f" | tail -n +2 | awk '{print $1}' \
            | grep -Ev '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$outside" ]; then
            echo "links outside the system, so it would not start on a clean Mac:" >&2
            echo "$outside" >&2
            exit 1
          fi

          file "$f" | grep -q 'Mach-O 64-bit executable arm64' \
            || { echo "NOT an arm64 Mach-O -- refusing to publish"; exit 1; }

      # Static linkage says nothing about whether the binary actually starts -- only
      # this leg can prove that, since the aarch64 binary cannot execute on this
      # x86_64 runner. Its own reported version is also the strongest evidence the tag
      # matches what ships: it is what a user runs `tui-do --version` against.
      - name: run it, and check its version against the tag
        if: ${{ !matrix.cross }}
        run: |
          f=target/${{ matrix.target }}/release/tui-do
          out="$("$f" --version)"
          echo "binary reports: $out"

          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"        # v1.0.0-rc.1 -> 1.0.0-rc.1
          tag_version="${tag_version%%-*}"  # 1.0.0-rc.1 -> 1.0.0
          bin_version="${out##* }"

          if [ "$bin_version" != "$tag_version" ]; then
            echo "tag $tag implies version $tag_version but the binary reported '$out'" >&2
            exit 1
          fi

      # This leg's binary cannot run here, so check the same claim against its source
      # instead: the workspace version the binary was built from.
      - name: check Cargo.toml's version against the tag
        if: ${{ matrix.cross }}
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          crate_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')"

          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag $tag implies version $tag_version but Cargo.toml has $crate_version" >&2
            exit 1
          fi

      - name: fetch the third-party licences
        uses: actions/download-artifact@v4
        with:
          name: third-party-licenses

      - name: stage the tarball
        run: |
          name="tui-do-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/tui-do "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.md "dist/$name/"
          # COPYFILE_DISABLE stops BSD tar writing `._` AppleDouble entries for extended
          # attributes, which would put junk files beside the binary in the tarball and
          # change its checksum for no reason. A no-op on Linux.
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
          ls -l "dist/$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: |
          # `cd dist` is load-bearing, not tidiness: sha256sum must run with the
          # tarballs as its cwd so SHA256SUMS records bare filenames, which is what the
          # README's `sha256sum --check --ignore-missing` needs. Running it from the
          # workspace root would bake `dist/` into every line and break that recipe.
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # A tag containing a hyphen is a pre-release by semver convention -- v1.0.0-rc.1
      # publishes as one, v1.0.0 does not.
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac

          # A re-run after a partial publish (say, one asset upload dropped mid-way)
          # finds the release the failed attempt already created; `gh release create`
          # errors on a release that exists rather than resuming it. Delete and recreate
          # for a clean retry -- the tag itself is untouched.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists -- removing it before recreating (partial-publish retry)"
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*.tar.gz dist/SHA256SUMS
