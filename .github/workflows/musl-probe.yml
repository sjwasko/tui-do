# THROWAWAY. Probe only: does this dependency tree build for musl at all?
# Delete with the branch.
name: musl probe

on:
  pull_request:
    branches: [main]

jobs:
  musl:
    name: build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: musl C toolchain, for the bundled SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --bin tui-do --target x86_64-unknown-linux-musl
      - name: is it actually static?
        run: |
          f=target/x86_64-unknown-linux-musl/release/tui-do
          ls -l "$f"
          file "$f"
          ldd "$f" || echo "not a dynamic executable — which is the answer we want"
      - uses: actions/upload-artifact@v4
        with:
          name: tui-do-musl
          path: target/x86_64-unknown-linux-musl/release/tui-do
