[package]
name = "tui-do-core"
description = "Domain model, local-first store, sync engine, quick-add parser and config for tui-do."
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tui-do-api.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
chrono.workspace = true
regex.workspace = true
aho-corasick.workspace = true
dirs.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Counters the integration tests read, such as `Store::payload_decodes`. Never needed by
# a build anyone runs; the dev-dependency below turns it on for this crate's own tests,
# and is path-only so `cargo publish` drops it rather than publishing a self-dependency.
test-hooks = []

[dev-dependencies]
wiremock.workspace = true
# Real zone rules, to test that quick-add resolves a date at the offset in force on that
# date (BUG-20). Tests only: the runtime gets its rules from `chrono::Local`.
chrono-tz.workspace = true
tui-do-core = { path = ".", features = ["test-hooks"] }
# `Connection::trace`, so a test can count the statements one task-list read runs
# (BUG-28). Tests only: a dev-dependency's features do not reach a normal build.
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
