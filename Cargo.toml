[workspace]
resolver = "2"
members = ["crates/tui-do", "crates/tui-do-api", "crates/tui-do-core", "crates/tui-do-smoke", "crates/tui-do-ui", "xtask"]

[workspace.package]
version = "1.2.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sjwasko/tui-do"
authors = ["Steve Wasko"]

[workspace.dependencies]
# Carrying a version as well as a path, which cargo needs only if these are ever
# published -- it builds from the path either way -- but which `cargo deny` needs now: a
# versionless path dependency reads as `*`, and `bans.wildcards = "deny"` rejects it.
# `allow-wildcard-paths` does not help, because it exempts only `publish = false` crates
# and these three are publishable.
#
# The alternative was to mark them unpublishable, which would have answered a question
# nobody has asked yet. This keeps that open. **The version here must match the crate's
# own** -- `workspace.package.version` above for `tui-do-api`, and the explicit `version`
# in `tui-do-core` and `tui-do-ui`, which went to 2.0.0 in 1.1.0 for breaking API changes
# while the binary stayed on 1.x. Bump both together.
tui-do-api = { path = "crates/tui-do-api", version = "1.2.1" }
tui-do-core = { path = "crates/tui-do-core", version = "2.0.0" }
tui-do-ui = { path = "crates/tui-do-ui", version = "2.0.0" }

ratatui = "0.30"
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
# `cookies` is not optional: `POST /user/token/refresh` answers "No refresh token provided."
# unless the refresh cookie set by `POST /login` is sent back with the request.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "multipart", "stream", "cookies", "query", "http2", "gzip"] }
rusqlite = { version = "0.41", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
# Tilde, not caret: `tui-do` turns on `unstable-dynamic`, which may break in any minor
# release, and `cargo install tui-do` without `--locked` would take a 4.7. See CLAUDE.md.
clap_complete = "~4.6.9"
regex = "1.13"
aho-corasick = "1.1"
fuzzy-matcher = "0.3"
# The same version ratatui measures with, so the width this crate computes for a column
# and the width ratatui draws it at cannot disagree.
unicode-width = "0.2"
# Cutting text at a grapheme rather than a `char`, so a flag or a ZWJ emoji is never split.
# Already in the tree by way of crossterm, so declaring it directly costs nothing new.
unicode-segmentation = "1.13"
# OSC 52 carries the clipboard payload base64-encoded. Already in the tree by way of
# the HTTP stack, so declaring it directly costs nothing new.
base64 = "0.22"
# Parsing a URL to find its host, for the production guard. Already in the tree by way of
# reqwest, so declaring it directly costs nothing -- and hand-rolling host extraction in a
# guard is how the guard grows a hole.
url = "2"
dirs = "6.0"
# Markdown -> HTML. `default-features = false` drops the CLI-only extras; the parser and
# `markdown_to_html` are in the default-off set.
comrak = { version = "0.54", default-features = false }
# HTML -> wrapped, annotated lines. The `css` feature is what lets a user-agent stylesheet
# colour headings, which the TextDecorator trait alone cannot do -- see the design's
# decision 5.
html2text = { version = "0.17", features = ["css"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

wiremock = "0.6"
# Real zone rules for tests only (BUG-20). Never a runtime dependency: the binary gets its
# rules from `chrono::Local`, which reads TZ and /etc/localtime itself.
chrono-tz = "0.10"

# Lints apply to every crate in the workspace. Each crate opts in with `[lints] workspace = true`.
#
# The `unwrap`/`panic` denials exist because cria — the project tui-do replaces — accumulated
# 67 `unwrap()` calls and 198 `.clone()`s with no CI lint gate at all. Denying them from commit
# one is cheaper than removing them later. Tests are exempt via `allow` attributes at the
# module level, not by weakening these.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
