[workspace]
resolver = "2"
members = ["crates/tui-do", "crates/tui-do-api", "crates/tui-do-core", "crates/tui-do-smoke", "crates/tui-do-ui", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sjwasko/tui-do"
authors = ["Steve Wasko"]

[workspace.dependencies]
tui-do-api = { path = "crates/tui-do-api" }
tui-do-core = { path = "crates/tui-do-core" }
tui-do-ui = { path = "crates/tui-do-ui" }

ratatui = "0.30"
crossterm = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
# `cookies` is not optional: `POST /user/token/refresh` answers "No refresh token provided."
# unless the refresh cookie set by `POST /login` is sent back with the request.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "multipart", "stream", "cookies", "query", "http2", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.2"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
regex = "1.13"
aho-corasick = "1.1"
fuzzy-matcher = "0.3"
# The same version ratatui measures with, so the width this crate computes for a column
# and the width ratatui draws it at cannot disagree.
unicode-width = "0.2"
dirs = "6.0"
# Markdown -> HTML. `default-features = false` drops the CLI-only extras; the parser and
# `markdown_to_html` are in the default-off set.
comrak = { version = "0.54", default-features = false }
# HTML -> wrapped, annotated lines. The `css` feature is what lets a user-agent stylesheet
# colour headings, which the TextDecorator trait alone cannot do -- see the design's
# decision 5.
html2text = { version = "0.17", features = ["css"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

wiremock = "0.6"

# Lints apply to every crate in the workspace. Each crate opts in with `[lints] workspace = true`.
#
# The `unwrap`/`panic` denials exist because cria — the project tui-do replaces — accumulated
# 67 `unwrap()` calls and 198 `.clone()`s with no CI lint gate at all. Denying them from commit
# one is cheaper than removing them later. Tests are exempt via `allow` attributes at the
# module level, not by weakening these.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
